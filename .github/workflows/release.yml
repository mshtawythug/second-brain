# =============================================================================
# GitHub Release + PyPI publish on CLI version tags (v*)
# -----------------------------------------------------------------------------
# Cuts a GitHub Release with auto-generated notes and publishes the sdist+wheel
# to PyPI whenever a `v*` tag is pushed (e.g. v0.2.1). This is the brain CLI
# release axis — distinct from the AGE Postgres IMAGE axis (age-image-* tags ->
# publish-age-image.yml). See the CHANGELOG.md intro for the two-version-axes
# rationale.
#
# Publishing (tag creation) is a deliberate human action: nothing here creates a
# tag. It only reacts to a tag the maintainer pushes. `workflow_dispatch` is also
# wired so the PyPI publish can be re-run manually if a publish step fails.
# =============================================================================
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release
    # Only cut a Release for real tag pushes. A manual workflow_dispatch (used to
    # re-run the PyPI publish) has no tag to release from, so this job is skipped.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  # ---------------------------------------------------------------------------
  # PyPI publish via Trusted Publishing (OIDC) — distribution `secondbrain-py`.
  #
  # No API token/secret is needed: the `pypi` deployment environment plus
  # `permissions: id-token: write` let pypa/gh-action-pypi-publish exchange a
  # short-lived OIDC token at publish time. The Trusted Publisher is configured
  # on PyPI (project `secondbrain-py`, owner `mshtawythug`, repo `second-brain`,
  # workflow `release.yml`, environment `pypi`).
  #
  # Runs on every `v*` tag push (in parallel with github-release) and on manual
  # workflow_dispatch, so a failed publish can be re-driven without re-tagging.
  # ---------------------------------------------------------------------------
  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
