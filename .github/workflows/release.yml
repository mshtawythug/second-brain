# =============================================================================
# GitHub Release on CLI version tags (v*)
# -----------------------------------------------------------------------------
# Cuts a GitHub Release with auto-generated notes whenever a `v*` tag is pushed
# (e.g. v0.2.0). This is the brain CLI release axis — distinct from the AGE
# Postgres IMAGE axis (age-image-* tags -> publish-age-image.yml). See the
# CHANGELOG.md intro for the two-version-axes rationale.
#
# Publishing (tag creation) is a deliberate human action: nothing here creates a
# tag. It only reacts to a tag the maintainer pushes.
# =============================================================================
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

  # ---------------------------------------------------------------------------
  # PyPI publish via Trusted Publishing (OIDC) — DISABLED until the PyPI project
  # and its trusted publisher are configured.
  #
  # To enable: create the `second-brain` project on PyPI, register this repo +
  # this workflow as a Trusted Publisher (PyPI project -> Settings -> Publishing),
  # then uncomment the job below. No API token/secret is needed — OIDC exchanges
  # a short-lived token at publish time (hence `permissions: id-token: write`).
