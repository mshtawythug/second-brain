# =============================================================================
# Retrieval eval gate — golden-corpus ranking harness CI (Task 5.5)
# -----------------------------------------------------------------------------
# Design decisions (CLAUDE.md "Eval gate (CI)"; plan
# docs/plans/2026-07-12-second-brain-overhaul.md Task 5.5):
#
#   * DEDICATED workflow, mirroring the benchmark-gate precedent. The `eval`
#     pytest marker stays OFF by default (pyproject.toml
#     addopts = "... -m 'not eval and not benchmark ...'") so local devs never
#     pay the live-corpus load on a normal `pytest`; this workflow opts in with
#     `-m eval`. The eval-marked tests (golden-corpus harness, answer harness,
#     concept-extractor gate) all SKIP cleanly when Ollama / a curated corpus is
#     unavailable, so this job's value in CI is import/collection regression
#     coverage — it turns red only when the harness itself breaks.
#
#   * PINNED Apache AGE image, same as benchmark.yml. One of the eval-marked
#     tests (test_graphrag_concept_gate) reaches the AGE-backed graph layer, so
#     we bring up the custom PG16 + pgvector 0.8.2 + AGE image via
#     docker-compose.age-test.yml (port 5434, db `second_brain_test`) — the same
#     instance the local test suite uses. A GitHub Actions `services:` block
#     can't `build:` an image inline, so compose is used instead of a service
#     container.
#
#   * The regression gate step (`brain eval --baseline ci --diff --fail-below`)
#     is CONDITIONAL, and on a GitHub-hosted runner the condition is NEVER
#     satisfiable. This is a property of the gate, not a missing chore.
#
#     An earlier revision of this comment said the step was "dormant until a
#     baseline is recorded", which reads as one commit away from working. It
#     is not: `ci.json` was recorded and committed, and the gate still cannot
#     run here, because scoring retrieval needs FOUR things a hosted runner
#     does not supply, in the order `brain eval` hits them:
#
#       1. The golden corpus file. tests/eval/golden_corpus.yaml is gitignored
#          by design (each developer authors their own against their own
#          documents), so it is absent on a fresh checkout. `load_corpus()`
#          runs before Config.load() and before any DB connection, so this
#          alone exits 1.
#       2. An initialised schema. This job brings the AGE instance up with
#          `up -d --build` and never runs `brain init`, so `documents` does
#          not exist. Resolving an expected-id prefix would raise
#          UndefinedTable.
#       3. Populated documents whose UUIDs match the baseline's. The baseline
#          records the ids it ranked; a freshly ingested corpus gets new UUIDs
#          and matches nothing, so every metric scores 0.0 and --fail-below
#          exits 3.
#       4. A reachable embedder. There is no Ollama on a hosted runner, so the
#          vector leg raises OllamaEmbedded and every query degrades to zeros.
#
#     The guard below therefore requires the corpus file as well as the
#     baseline, so the step self-arms only where it can genuinely run — a
#     developer machine, or a self-hosted runner attached to a live brain.
#     Retrieval-quality regression detection is a LOCAL pre-merge check; this
#     job's value is harness health (see the first bullet).
#
#   * Concurrency: cancel in-progress runs only on PRs (most recent push wins);
#     master/main keeps a complete audit trail.
# =============================================================================
name: eval

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    name: Retrieval eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://brain:brain@localhost:5434/second_brain_test
      TEST_DATABASE_URL: postgresql://brain:brain@localhost:5434/second_brain_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build + start the pinned AGE test instance
        # TODO flip to pull-first once ghcr.io/mshtawythug/second-brain-age is public
        run: docker compose -f docker-compose.age-test.yml up -d --build

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Wait for the AGE instance to be ready
        run: |
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5434 -U brain -d second_brain_test; then
              echo "AGE instance is ready"
              exit 0
            fi
            echo "waiting for AGE instance ($i/60)..."
            sleep 2
          done
          echo "AGE instance did not become ready in time" >&2
          docker compose -f docker-compose.age-test.yml logs --tail=50
          exit 1

      - name: Run the eval harness (skips cleanly without a live corpus/Ollama)
        run: pytest -m eval --no-cov -v

      - name: Eval regression gate (only where it can genuinely run)
        run: |
          # Needs BOTH the committed baseline and the local golden corpus. The
          # corpus is gitignored by design, so on a GitHub-hosted runner this
          # is always the skip branch — by construction, not by omission. See
          # the four unmet preconditions in this file's header comment.
          if [ -f tests/eval/baselines/ci.json ] && [ -f tests/eval/golden_corpus.yaml ]; then
            echo "baseline + corpus present — running the eval regression gate"
            brain eval --baseline ci --diff --fail-below
          elif [ -f tests/eval/baselines/ci.json ]; then
            echo "tests/eval/baselines/ci.json present but tests/eval/golden_corpus.yaml is absent"
            echo "(gitignored by design) — retrieval regression gate skipped; it is a LOCAL check."
          else
            echo "tests/eval/baselines/ci.json absent — eval regression gate skipped"
          fi

      - name: Tear down the AGE test instance
        if: always()
        run: docker compose -f docker-compose.age-test.yml down -v
