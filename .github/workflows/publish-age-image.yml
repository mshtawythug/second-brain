# =============================================================================
# Publish the custom Apache AGE Postgres image to GHCR (multi-arch)
# -----------------------------------------------------------------------------
# Builds the pinned PG16 + pgvector 0.8.6 + Apache AGE 1.5.0-rc0 image from the
# canonical Dockerfile (src/brain/templates/docker/age/Dockerfile) and pushes it
# to the GitHub Container Registry so fresh installs can PULL a prebuilt image
# instead of compiling AGE from C source on every machine (slow + fragile on
# Apple Silicon). The compose files still carry a `build:` stanza as a local
# fallback when the pull is unavailable.
#
# Image ref produced: ghcr.io/mshtawythug/second-brain-age:pg16-v1.5.0-rc0-pgv0.8.6
#
# TWO INDEPENDENT VERSION AXES (see CHANGELOG.md intro):
#   * age-image-*  tags  -> AGE Postgres IMAGE releases (this workflow)
#   * v*           tags  -> brain CLI releases           (release.yml)
# The image tag string (pg16-v1.5.0-rc0-pgv0.8.6) is pinned to the AGE +
# pgvector versions baked into the Dockerfile, NOT to the CLI version — bumping
# the CLI does not rebuild the image, and rebuilding the image does not bump the
# CLI.
#
# One-time setup after the FIRST successful publish: the GHCR package is created
# PRIVATE by default. Toggle its visibility to Public in the repo/org package
# settings so anonymous `docker pull` (and the compose pull-first path) works
# without auth. This is a manual, one-time GitHub UI action.
#
# Performance note: the linux/arm64 leg builds under QEMU emulation and is slow
# (~10-20 min for the AGE compile). It is cached (type=gha, mode=max) and this
# workflow runs rarely (only when the Dockerfile changes or an age-image-* tag
# is pushed), so the cost is acceptable.
#
# PR LEG (build check, never a publish): ci.yml, eval.yml and benchmark.yml all
# PULL this image first, so none of them builds the Dockerfile while the pull
# succeeds. A Dockerfile edit that keeps the same tag (a new apt package, a build
# flag) would otherwise never be built on its own PR. On a pull_request touching
# the Dockerfile directory or this workflow, the job builds linux/amd64 only,
# skips QEMU and the GHCR login, and does not push. The push trigger below and
# everything it does are unchanged. Locked by
# tests/test_publish_age_image_workflow_contract.py.
# =============================================================================
name: publish-age-image

on:
  push:
    tags:
      - "age-image-*"
    branches:
      - master
    paths:
      - "src/brain/templates/docker/age/**"
  pull_request:
    paths:
      - "src/brain/templates/docker/age/**"
      - ".github/workflows/publish-age-image.yml"
  workflow_dispatch:

# Serialize builds: all runs push the SAME fixed image tag, so overlapping
# master-Dockerfile pushes (or a dispatch overlapping a push) would otherwise race
# duplicate ~20-min QEMU builds to the same ref. A single static group (not
# ref-scoped) with cancel-in-progress keeps at most one build in flight, newest wins.
# PR runs get their own per-ref group, so a PR build check can never cancel an
# in-flight publish (and a newer push to the same PR replaces the older check).
concurrency:
  group: publish-age-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build + push multi-arch AGE image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (arm64 emulation)
        # PRs build amd64 only, natively on the amd64 runner: no emulation needed.
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # PRs never push, so they need no registry credentials.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mshtawythug/second-brain-age
          # MUST match the Dockerfile FROM (`pgv<version>`) and AGE_REF (`v<version>`).
          # Publishing new base content under an old tag mislabels an immutable
          # artifact AND makes CI's pull-first path silently reuse the stale image.
          # Guarded by tests/test_packaging_templates.py::test_age_image_version_pins_agree_everywhere.
          tags: |
            type=raw,value=pg16-v1.5.0-rc0-pgv0.8.6
            type=raw,value=latest

      - name: Build (PR, amd64, no push) or build + push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: src/brain/templates/docker/age
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
