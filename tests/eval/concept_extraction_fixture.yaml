# Synthetic labeled fixture for the GraphRAG concept-extractor eval gate
# (wave G2-j; spec §17b decision 2). SHIPPED in-repo on purpose — unlike the
# gitignored golden_corpus.yaml, every document and concept here is SYNTHETIC
# (invented orgs/topics/projects/tools, no real people, no PII). It exists so
# the live-Ollama gate has a stable, hand-labeled target set.
#
# Gold = the unique (entity_type, canonical_key) concept pairs the extractor
# SHOULD find. PEOPLE ARE EXCLUDED (they come from the participants pipeline,
# not the LLM extractor) — every gold `type` must be one of org/topic/project/
# tool. Concept names appear verbatim in the text so a competent small model
# can recover them.
version: 1
docs:
  - id: synth-billing-001
    text: >
      We finished the migration of our billing platform onto Stripe this
      sprint. Project Aurora handled the subscription invoicing logic, and the
      whole effort was tracked in Jira. Pricing tiers were re-modeled to support
      usage-based billing.
    gold:
      - {type: org, key: stripe}
      - {type: project, key: project aurora}
      - {type: tool, key: jira}
      - {type: topic, key: billing}
      - {type: topic, key: pricing}

  - id: synth-infra-002
