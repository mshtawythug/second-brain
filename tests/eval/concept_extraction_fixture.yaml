      The platform team moved our container workloads to Kubernetes and added
      Datadog dashboards for observability. Project Helios is the umbrella
      initiative covering the migration. Latency and reliability were the main
      topics in the review.
    gold:
      - {type: tool, key: kubernetes}
      - {type: tool, key: datadog}
      - {type: project, key: project helios}
      - {type: topic, key: observability}
      - {type: topic, key: reliability}

