services:
  postgres:
    # Prod stays on stock pgvector until the explicit, gated cutover — see
    # docs/specs/2026-05-20-graphrag-age-image.md. AGE runs for tests via
    # docker-compose.age-test.yml (separate project, port 5434, named volume).
    image: pgvector/pgvector:pg16
    container_name: second-brain-postgres
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: second_brain
    ports:
      # Host 5433 collides with another local project's Postgres; use 55432.
      - "55432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d second_brain"]
      interval: 5s
      timeout: 3s
      retries: 10
