[project]
name = "second-brain"
version = "0.1.0"
description = "Local personal knowledge base with hybrid search, queryable by Claude"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "pypdf>=5.0",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "markdown-it-py>=3.0",
  "typer>=0.13",
  "rich>=13.9",
  "python-dotenv>=1.0",
  "tiktoken>=0.8",
  "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.13", "reportlab>=4.0"]

[project.scripts]
brain = "brain.cli:app"
brain-mcp = "brain.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=brain --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer uses typer.Argument/Option/Typer as defaults — the standard idiom.
extend-immutable-calls = ["typer.Argument", "typer.Option", "typer.Typer"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "pdfplumber.*", "pypdf.*", "markdown_it.*", "docx.*", "tiktoken.*", "reportlab.*"]
ignore_missing_imports = true
