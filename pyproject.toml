[project]
name = "secondbrain-py"
version = "0.3.0"
description = "Local personal knowledge base with hybrid search, queryable by Claude"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
  "second-brain",
  "knowledge-base",
  "rag",
  "pgvector",
  "hybrid-search",
  "mcp",
  "ollama",
  "local-first",
]
# NOTE: no `License ::` trove classifier here — the license is declared via the
# PEP 639 SPDX expression (`license = "MIT"` + `license-files`) above. setuptools
# >= 77 rejects a `License ::` classifier alongside an SPDX license expression
# ("License classifiers have been superseded by license expressions"), so the
# classifier would break the build. PyPI derives the license from the expression.
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  # Cap <4: psycopg 4 does not exist yet, which is precisely when the bound is
  # free to add. `brain` is coupled to psycopg *3* more deeply than to anything
  # else it depends on — 432 `psycopg.Connection` annotations plus
  # `psycopg.sql`, `psycopg.errors`, `psycopg.conninfo` and `psycopg.pq` — and
  # `pgvector.psycopg.register_vector` (db.py:50) adapts psycopg3 specifically,
  # so a major bump breaks the *pair*, not one call site. Nothing else in the
  # resolved tree constrains psycopg, so this line is the only gate there is.
  # Not a claim that 4 will break — a requirement that it be tested first.
  # Exercised: 3.3.4 only (it is what both venvs resolve). The floor 3.2 is
  # inherited, not re-measured — unlike typer's, no control run backs it.
  "psycopg[binary]>=3.2,<4",
  # Bounded on BOTH sides for the same reason `typer` is (below) — and this one
  # was not hypothetical either. It broke, silently, during this release cycle.
  #
  # Floor >=0.3: honestly, NOT a known-breakage boundary. Probed against a live
  # PG16 + `vector` database, the entire surface `brain` actually uses —
  # `pgvector.psycopg.register_vector` (db.py:50), binding a `list[float]` as a
  # `%s::vector` param, `SELECT avg(embedding)`, re-binding that loaded value
  # as a param (wiki/build_related.py:347,433), and the `::real[]` cast
  # (review/queries.py:363) — passes identically on 0.2.0, 0.2.5, 0.3.0, 0.3.6,
  # 0.4.0, 0.4.2 and 0.5.0. The floor is left where it was rather than raised:
  # there is no evidence for a higher one, and a pin nobody tested is the thing
  # this comment block exists to stop.
  #
  # Cap <0.6: 0.5.0 is the newest release and is verified green. pgvector is a
  # 0.x project, so each MINOR is effectively a major — and 0.5.0 proved it:
  # the loader `register_vector` installs switched from returning a
  # `numpy.ndarray` (iterable) to a `pgvector.Vector` (NOT iterable), so
  # `[float(x) for x in vec]` began raising `TypeError: 'Vector' object is not
  # iterable` and took down every `brain review` contradiction and staleness
  # scan. Reproduced directly: same code, same DB, 0.4.2 green -> 0.5.0
  # TypeError. `review/queries.py` now casts to `real[]` in SQL so it no longer
  # depends on the adapter's return type at all — but that retires the one
  # dependence we knew about, not the class. The cap is not a claim that 0.6
  # will break; it is a requirement that the next minor be *tested* before
  # users get it. Nothing else in the tree constrains pgvector either.
  #
  # Exercised: 0.2.0 / 0.2.5 / 0.3.0 / 0.3.6 / 0.4.0 / 0.4.2 / 0.5.0 on the
  # surface probe above; 0.4.2 and 0.5.0 under the full test suite.
  "pgvector>=0.3,<0.6",
  # Deliberately NOT capped, and this was checked rather than assumed: `mcp`
  # (a hard dependency below) already pins `httpx<1.0.0,>=0.27.1`, so httpx is
  # ALREADY bounded for every install of this package. A second `<1` here would
  # constrain nothing the resolver is not constrained by, and would have to be
  # lifted in two places when `mcp` moves. The exposure is small in any case:
  # `chat.py`'s narrow `ConnectError/ConnectTimeout/ReadTimeout` catch is
  # backstopped by an `httpx.HTTPError` branch that raises the same
  # `OllamaUnavailable`, so a reshuffled exception tree costs message detail,
  # not behaviour.
  "httpx>=0.27",
  # The extractors here, plus `rich` and `watchdog` further down, are
  # deliberately left unbounded — a conclusion, not an oversight. The resolver
  # has ALREADY carried most of them across at least one major above the
  # declared floor (pypdf 5 -> 6.15, rich 13 -> 15, watchdog 4 -> 6;
  # python-docx 1.1 -> 1.2 and pdfplumber are still within their line) and the
  # suite is green on exactly those versions in both venvs.
  # `markdown-it-py` was in this list as "3 -> 4.2" until phase 1 raised its
  # floor to 4.2 for the `[plugins]` extra — it is no longer an example of the
  # resolver running ahead of the declared floor, so it was removed rather than
  # left as a claim the pin below contradicts.
  # They are narrow leaf surfaces — pull text out of a file, draw a table —
  # where a break is a loud ImportError or a visibly failed extraction, not the
  # silently-wrong result that justifies the caps on `pgvector` and `typer`.
  # Upper bounds here would buy nothing and cost real resolution conflicts in
  # shared environments.
  "pypdf>=5.0",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  # The `[plugins]` extra pulls `mdit-py-plugins`, which `brain ui` uses for
  # ONE thing: GFM task lists (`mdit_py_plugins.tasklists`). §2.1 waiver granted
  # 2026-08-11 on measured usage — 180 corpus documents carry a task list,
  # 6,745 items in total (159 ingested / 21 vault), counted with the markdown-it
  # TOKENIZER rather than a substring scan, because substring counts of this
  # corpus have been wrong in both directions (strikethrough 38 -> 31, footnotes
  # 3 -> 0, task lists 145 -> 180).
  # An EXTRA of an already-declared dependency, not a new top-level one:
  # markdown-it-py declares `mdit-py-plugins>=0.5.0 ; extra == "plugins"`.
  # Floor raised 3.0 -> 4.2 for the extra: 4.2.0 is the version measured to
  # declare it, and asserting `>=3.0` supports `[plugins]` would be a claim
  # about a release nothing here has checked. Resolved: mdit-py-plugins 0.6.1.
  # Unbounded above for the reason given for the extractors below — the surface
  # used is one plugin registration whose failure is a loud ImportError.
  "markdown-it-py[plugins]>=4.2",
  # Bounded on BOTH sides, and both ends are exercised — see
  # `tests/test_cli_config_error_presentation.py`. Typer renders the entire
  # CLI, so an unbounded pin means the exit codes and help output a user gets
  # depend on the day they installed. That is not hypothetical: it shipped.
  #
  # Floor 0.26 — RAISED from 0.16 on 2026-08-07 after the old floor was found
  # to admit a live, user-facing break. Three earlier versions of this comment
  # were wrong; this one is written from a differential of the SHIPPED CLI run
  # as a subprocess, because at the time the defect was found the test suite
  # did not cover it at all (see "false green" below — that gap is now closed,
  # but the suite is still not what found this).
  #
  # THE BREAK. `brain show` with its required ID argument omitted:
  #
  #     typer 0.16.0 + click 8.2.1   exit 2, "Missing argument 'ID'."   OK
  #     typer 0.16.0 + click 8.3.0   exit 1, Rich traceback            BROKEN
  #     typer 0.16.0 + click 8.4.2   exit 1, Rich traceback            BROKEN
  #     typer 0.18.0 + click 8.4.2   exit 2, "Missing argument 'ID'."   OK
  #
  # typer 0.16.0-0.17.4 declare `click>=8.0.0` with no cap, so a resolver hands
  # them click 8.4.2 and every missing-argument error becomes exit 1 plus a
  # traceback — the exact failure mode `cli_errors.py` was written to remove,
  # reachable under the OLD pin. Worse, the traceback renders `Config`'s locals,
  # which include `voyage_api_key`. A required-argument typo printed the user's
  # API key.
  #
  # The break is silent, not loud: Typer passes `id=None` into the command
  # body, `show()` RUNS, opens a database connection, and only then dies in
  # `queries.py` on `len(None)`. Nothing rejects the invocation.
  #
  # WHY EVERY HARNESS-BASED MEASUREMENT MISSED THIS, which is the part worth
  # keeping — three separate passes over this pin, all through `CliRunner`, all
  # blind, for TWO independent reasons:
  #
  #   1. The defect is a SILENT ACCEPTANCE. The parser does not reject the
  #      invocation, so there is no usage error for a runner to observe; the
  #      command runs and fails later, deep in application code, looking like
  #      an ordinary bug rather than a framework pairing problem.
  #   2. Below click 8.2 `CliRunner` is broken on its own account (stderr
  #      merged into stdout), so the half of the matrix where the pairing
  #      question actually lives could not be measured through it at all.
  #
  # The only method that sees it is running the installed console script in a
  # subprocess and asking what the USER gets — exit code and stderr — instead
  # of asking whether the tests pass. If you revisit this pin, use that method;
  # re-running the suite across versions will tell you nothing new.
  #
  # Boundaries, measured on both axes (subprocess against the installed console
  # script, per the note above):
  #
  #     typer 0.16.0 x click 8.0.4 / 8.1.0 / 8.1.8 / 8.2.0 / 8.2.1     clean
  #     typer 0.16.0 x click 8.3.0 / 8.4.0 / 8.4.2                     BROKEN
  #     click 8.4.2  x typer 0.16.0 / 0.16.1 / 0.17.0 / 0.17.5         BROKEN
  #     click 8.4.2  x typer 0.18.0 / 0.19.0 / 0.19.2 / 0.20.1 / 0.21.2 /
  #                    0.22.0 / 0.23.1 / 0.23.2 / 0.24.0 / 0.25.1 /
  #                    0.26.0 / 0.26.8 / 0.27.0 / 0.27.1               clean
  #     click 8.0.4  x typer 0.18.0 / 0.19.2 / 0.20.1 / 0.21.2 /
  #                    0.22.0 / 0.23.1 / 0.26.0 / 0.27.1               clean
  #
  # UPSTREAM CONFIRMS THE READING, which is why this is a pairing defect and
  # not a guess about our own code:
  #
  #     click 8.3.0   released 2025-09-18
  #     typer 0.17.5  released 2025-09-19   <- caps click<8.3.0
  #     typer 0.18.0  released 2025-09-19   <- supports click 8.3
  #
  # Typer shipped both a cap and a fix the day after click 8.3.0 landed. 0.18.0
  # is upstream's own compatibility boundary, and it is exactly where the
  # measured boundary above falls.
  #
  # THE FALSE GREEN — WHY THE FLOOR IS 0.26 AND NOT 0.18. Historically the
  # suite was blind to this defect: on typer 0.16.0 + click 8.4.2 it reported
  # all-green while the CLI was visibly broken, because nothing in tests/ ever
  # invoked a command with a required argument missing. "Tests green at version
  # X" was therefore NOT evidence that X worked, anywhere in this range.
  #
  # That blind spot is now CLOSED, and the gate is not vacuous — measured on
  # the 20-file CLI-surface set, one variable (typer) changed:
  #
  #     typer 0.16.0 + click 8.4.2   1 failed, 362 passed, 1 skipped
  #         ^ the failure IS test_a_missing_required_argument_is_a_usage_error_
  #           not_a_crash, in tests/test_cli_config_error_presentation.py
  #     typer 0.18.0 + click 8.4.2   363 passed, 1 skipped, 0 failed
  #     typer 0.26.0 + click 8.1.8   364 passed, 0 failed
  #
  # So `>=0.18` would in fact fix the defect AND be caught by the suite if it
  # regressed. The floor is nevertheless 0.26, for a narrower reason than the
  # one first written here: from 0.26 on click is VENDORED (`typer._click`) and
  # the external-click axis ceases to exist, so the supported window is two
  # minors with ONE dimension instead of eight minors crossed with every click
  # release yet to be published. [0.18, 0.26) was measured clean against both
  # the oldest (8.0.4) and newest (8.4.2) click a resolver can reach — the
  # exclusion is a hedge against future click releases, not against a known
  # break. Recorded plainly because it is the one bound in this file that goes
  # PAST its measured breakage boundary, which the `pgvector` note above
  # explicitly declines to do.
  #
  # Tradeoff, stated once: anyone co-installing a package that pins
  # `typer<0.26` now gets a resolver error instead of a silently broken CLI.
  # That is the right trade for a tool installed via pipx/uv-tool into its own
  # environment, which is how `brain` is documented and shipped.
  #
  # Why not fix this with a `click` pin instead: it cannot be done. The bad
  # pairing needs `click<8.3` to be excluded for typer 0.16-0.17.4 but
  # `click>=8.2` for the test harness, and typer 0.24+ demands `click>=8.2.1`.
  # No single click constraint is simultaneously correct across the old range —
  # the typer floor is the only lever that works.
  #
  # For the record, which broken pairings a resolver could actually REACH.
  # EVERY typer release from 0.15.0 to 0.27.1 was re-read on 2026-08-07 from
  # its own wheel METADATA, unzipped from the PyPI-hosted wheel — all 43, not a
  # sample. The rows below are the resulting groups of identical constraints,
  # so a version absent from a range is absent because it does not differ:
  #
  #     typer 0.15.0-0.15.3   click>=8.0.0
  #     typer 0.15.4          click<8.2,>=8.0.0     <- capped
  #     typer 0.16.0-0.17.4   click>=8.0.0          <- UNCAPPED: reaches 8.4.2,
  #                                                    so REACHABLE and BROKEN
  #     typer 0.17.5          click<8.3.0,>=8.0.0   <- self-capped, safe
  #     typer 0.18.0-0.23.1   click>=8.0.0          <- uncapped, and clean
  #     typer 0.23.2          click>=8.0.0 (py<3.10) / click>=8.2.1 (py>=3.10)
  #                                        <- on 3.11 the >=8.2.1 arm applies
  #     typer 0.24.0-0.25.1   click>=8.2.1
  #     typer 0.26.0-0.27.1   (no click dependency — vendored)
  #
  # CORRECTION: three earlier versions of this table carried
  # `typer 0.23.2  click>=8.0.0; python_version < "3.10"` annotated "none on
  # 3.11". That is FALSE. 0.23.2 ships a SECOND marker, `click>=8.2.1` for
  # python>=3.10, and on this project's 3.11 floor that is the arm that
  # applies — so 0.23.2 is one of the SAFE releases, not an unconstrained one.
  # The error inverted its meaning, making a safe version read as a hazard.
  # It survived three rewrites because each copied the table forward instead of
  # re-reading it; the sweep above exists so that cannot happen a fourth time.
  #
  # The click cap appears and vanishes across patch releases (0.15.1 no, 0.15.4
  # yes, 0.16.0 no, 0.17.5 yes, 0.18.0 no), so there is no monotone cut anywhere
  # in [0.16, 0.26). Note 0.17.5's `click<8.3.0` is exactly what makes it SAFE
  # while the uncapped 0.16.0 is not — the old floor drew its line one release
  # short of the protection.
  #
  # Cap <0.28: 0.27.1 is the newest release and is verified green. The cap is
  # not a claim that 0.28 will break — it is a requirement that the next minor
  # be *tested* before users get it. (Typer 0.26's vendoring is also what broke
  # a hand-raised `click.UsageError` into exit 1 + traceback; `cli_errors.py`
  # routes through `ctx.fail()` so both sides of that split behave identically.)
  #
  # WHAT IS ACTUALLY ENFORCED, as opposed to claimed. CI installs
  # `pip install -e ".[dev]"` and so resolves only the CEILING — currently
  # 0.27.1. It is one point, not a matrix. The floor 0.26.x is NOT exercised by
  # CI; it was covered by hand (see the run counts above) and will go stale.
  # The honest summary of coverage inside the shipped range:
  #
  #     0.27.1  CI, every push          <- the only automated leg
  #     0.26.0  hand-run 2026-08-07, full 20-file CLI-surface set + CLI probes
  #     0.26.8, 0.27.0                  <- CLI probes only, no suite run
  #
  # Every figure in this block was produced by hand in throwaway venvs on
  # 2026-08-07. Dated measurements, not a standing guarantee — if you move
  # either bound, re-run them, because nothing in this repo will do it for you.
  # The one thing that IS self-enforcing is the missing-argument gate in
  # `tests/test_cli_config_error_presentation.py`: it goes red on a broken
  # pairing (shown above), so a future floor change that reopens this hole
  # fails the suite rather than shipping quietly.
  "typer>=0.26,<0.28",
  "rich>=13.9",
  "python-dotenv>=1.0",
  "tiktoken>=0.8",
  # Supports both mcp majors, and both ends are exercised. mcp 2.0 renamed the
  # two names this project imports — `McpError` -> `MCPError`, and
  # `mcp.server.fastmcp.FastMCP` -> `mcp.server.mcpserver.MCPServer` — with no
  # alias in either direction, and changed the error constructor from
  # `McpError(ErrorData(...))` to `MCPError(code, message)`. `brain/mcp_compat.py`
  # resolves all three at import time; `tests/test_mcp_compat.py` fails if any
  # major-specific spelling reappears in `src/`. Floor is 1.2, NOT 1.0:
  # `mcp.server.fastmcp` landed in 1.2.0, so `brain-mcp` cannot import on
  # 1.0.0/1.1.0 (verified: ModuleNotFoundError) — the old `>=1.0` was a false
  # claim already in the pin.
  # Exercised under the full 626-test MCP suite: 1.2.0, 1.29.0, 2.0.0.
  "mcp>=1.2,<3.0",
  # `brain ui` imports these directly. They resolve transitively via `mcp`
  # today, so declaring them adds zero new wheels — it stops a silent
  # import-time break if `mcp` ever drops them.
  "starlette>=0.47,<2",
  "uvicorn>=0.30",
  # Same shape as starlette/uvicorn above: `brain ui`'s markdown renderer
  # imports pygments directly to tokenise fenced code (212 corpus documents
  # carry a language-tagged fence, 211 ingested / 1 vault). It resolves
  # transitively via `rich`, which requires `pygments>=2.13.0,<3.0.0`, so
  # declaring it adds ZERO new wheels — 2.20.0 is what is already installed and
  # what the suite is green on. The declaration stops a silent import-time
  # break if `rich` ever drops it.
  # Floor is 2.13 because that is `rich`'s own floor: below it the version
  # actually present is unconstrained by anything in this file. No upper bound
  # for the reason given for the extractors above — the surface used here is
  # `get_lexer_by_name` + `HtmlFormatter(nowrap=True)`, two of the oldest and
  # most stable entry points in the library, and a break is a loud
  # `ImportError` or visibly untokenised code, not a silently wrong result.
  "pygments>=2.13",
  "voyageai>=0.3",
  "pyyaml>=6.0",
  "watchdog>=4.0",
  "networkx>=3.2",
]

[project.optional-dependencies]
# Browser harness for `brain ui` (opt-in). NOT a runtime dependency and
# deliberately NOT in `dev`: it exists to execute the DOM and read the
# accessibility tree, which nothing else in this suite can do.
#
# MEASURED 2026-08-11: the pip package is small and Playwright caches its
# browsers OUTSIDE the venv (~/Library/Caches/ms-playwright, 4.3 GB already
# present), so a `brain-ci` venv rebuild re-installs the package in seconds
# and reuses the cached browser — verified by launching chromium after a
# fresh install with no `playwright install` step.
#
# DONE 2026-08-13 — the harness is now GATE-ENFORCED by the `browser` job in
# .github/workflows/ci.yml, which runs
# `pytest tests/test_ui_browser.py -m browser --no-cov` on every PR. Before
# that job existed those 33 tests ran in no workflow at all.
#
# ONE DIVERGENCE from the plan sketched here, and it is deliberate: this line
# did NOT move into `dev`. The job names both extras
# (`pip install -e ".[dev,browser]"`) instead, so the gate gets playwright
# while a contributor's plain `.[dev]` install still does not pull a browser
# harness it does not need — which is what the first paragraph above asks for.
# Moving it would have made those two paragraphs contradict each other.
#
# The CI job did NOT touch `addopts` (the `and not browser` there predates it):
# the marker is still deselected from the default suite, so the job is purely
# additive and the gate lives in CI only. A local `pytest` is unaffected.
browser = ["playwright>=1.40"]
# NO `click` pin here, deliberately, and it was measured rather than assumed.
#
# There IS a real click floor in this suite — click < 8.2's `CliRunner` merges
# stderr into stdout, so the many `result.stderr` reads raise
# `ValueError: stderr not separately captured`. On typer 0.16.0 that cost
# `78 failed, 756 passed` against click 8.1.8 versus `0 failed, 834 passed`
# against 8.4.2 — measured on `tests/test_cli*.py tests/test_new_skills.py`,
# and note the `834 passed` predates the missing-argument gate: on that same
# pairing the suite now goes red, which is the whole point of adding it.
#
# But it stops existing at typer 0.26, which `[project.dependencies]` now
# requires: from 0.26 on `typer.testing.CliRunner` comes from the VENDORED
# click, so the external one is irrelevant to the harness. Verified at the new
# floor against the oldest click a resolver can reach, on the FULL 20-file
# CLI-surface set rather than a sample:
#
#     typer 0.26.0 + click 8.1.8   364 passed, 0 failed
#     typer 0.26.0 + click 8.0.4   CLI probes clean (suite not re-run)
#
# For contrast, the same 20-file set on a typer that predates the vendoring:
#
#     typer 0.16.0 + click 8.1.8   20 failed, 342 passed
#         ^ 19 of those 20 are `ValueError: stderr not separately captured`;
#           the 20th is an unrelated AGE/psycopg fixture-state flake that
#           reproduces identically on click 8.4.2, so it is not click's
#
# So a `click>=8.2` here would subtract nothing. It is left out on purpose.
# **If the typer floor is ever lowered below 0.26, add it back** — that is the
# single condition under which it becomes load-bearing again.
#
# Note the asymmetry, since it is what misled two passes at this file: click
# < 8.2 breaks the TEST HARNESS only. The shipped CLI is clean there — verified
# at the ceiling, `typer 0.27.1 + click 8.1.8` and `+ click 8.0.4`, every probe
# identical to the default resolve. So an environment that caps click below 8.2
# does NOT give a user a broken CLI. The pairing that does is the inverse — an
# environment that caps TYPER, which is what the floor above now blocks.
# `coverage` is capped, and the cap was RE-MEASURED on 2026-08-08 rather than
# inherited. The old bound was `<7.13`, traced to a one-line aside in
# docs/plans/2026-05-05-wiki-ux-overhaul-finish-handoff.md: "Coverage tooling
# broken (numpy 2.4.4 + coverage 7.13 + pgvector C-ext) — always use --no-cov".
# That claim DID NOT REPRODUCE and the bound has been lifted to the current
# ceiling. Recorded here because the reason was never written at the pin site,
# which is why Dependabot #5 could propose `<7.16` and nobody could triage it.
#
# WHAT THE CAP PROTECTS — the coverage GATE, not pgvector. `addopts` carries
# `--cov-fail-under=85`, and tests/test_ci_workflow.py forbids CI from passing
# `--no-cov`, so there is NO escape hatch: a release that changes what gets
# measured erodes the 85% floor quietly instead of failing loudly. So the thing
# to measure when moving this bound is not "do the tests pass" — it is "is the
# reported PERCENTAGE the same". A version that collects fine and measures 3%
# low is the dangerous one.
#
# MEASURED, two slices, coverage collection ON (`--cov-fail-under=0`, never
# `--no-cov` — that is exactly what hides this), isolated COVERAGE_FILE per run,
# percentages from --cov-report=json to 6 decimals:
#
#     coverage   slice A (111 tests, pgvector/AGE)   slice B (1555 tests)
#     7.12.0     111 passed   22.727469%            1555 passed   43.733552%
#     7.13.0     111 passed   22.727469%            1555 passed   43.733552%
#     7.13.5     111 passed   22.727469%            1555 passed   43.733552%
#     7.14.3     111 passed   22.727469%            1555 passed   43.733552%
#     7.15.4     111 passed   22.727469%            1555 passed   43.733552%
#
# Bit-identical — same covered-line count, same percentage to 6 decimals. Slice
# A re-run on Python 3.14.5 (the interpreter .venv uses, where coverage defaults
# to the sysmon core) on 7.12.0 / 7.13.0 / 7.15.4: identical there too. Three
# layers isolated separately: all five versions `coverage report` over ONE
# identical data file -> identical output; `PythonParser` over all 211 files of
# src/brain -> 23404 statements on all five, zero files differing (so the 85%
# denominator is version-invariant); `--fail-under=85` still exits 2.
#
# WHY 7.13.0 WAS THE WRONG SUSPECT. Its only real behaviour delta vs 7.12.0 is a
# permanent `a1_coverage.pth` in site-packages (issue 2084) — and that file is
# inert here: its body is guarded by COVERAGE_PROCESS_START / _CONFIG, neither of
# which is set anywhere in this repo or by pytest-cov 7.1.0. The rest of 7.13.0
# is `.coveragerc.toml` support (unused; config lives here) and deprecation
# banners on the `coverage3` entry points (never invoked — only `python -m
# pytest`). The "pgvector C-ext" reading has no mechanism behind it, and the
# contract test's old name (`..._below_pgvector_breaking_range`) was a misnomer
# copied from the pgvector pin above. Both are now fixed.
#
# Cap <7.16: 7.15.4 is the newest release and is verified green. Not a claim that
# 7.16 breaks — a requirement that the next minor be MEASURED before users get
# it, same convention as `typer` and `pgvector` above.
#
# NO FLOOR, deliberately: `pytest-cov` already bounds coverage from below for
# every install (7.1.0 requires coverage[toml]>=7.10.6; even the declared floor
# pytest-cov 5.0.0 requires >=5.2.1). A second floor here would constrain nothing
# and would need lifting in two places when pytest-cov moves.
#
# ONE FORWARD-LOOKING HAZARD worth knowing, since it is new in this range: from
# 7.14.0 the reporting commands IMPLICITLY COMBINE parallel data files, with no
# opt-out. A stale `.coverage.*` in the repo root now silently folds into the
# report. It did not affect the numbers above (checked: one `.coverage`, zero
# `.coverage.*`), but it is a real way for a future measurement to be wrong —
# use an isolated COVERAGE_FILE when measuring.
#
# The self-enforcing part is tests/test_dev_dependency_pins.py: it asserts the
# UPPER BOUND against a named MEASURED_COVERAGE_CEILING constant (parsed, not
# substring-matched, unlike the version it replaced) and its failure message
# states how to re-measure. Move this bound and that constant must move with it.
dev = ["pytest>=8.3", "pytest-cov>=5.0", "coverage<7.16", "pytest-mock>=3.14", "ruff>=0.7", "mypy>=1.13", "reportlab>=4.0", "types-PyYAML>=6.0"]

[project.scripts]
brain = "brain.cli:app"
brain-mcp = "brain.mcp_server:main"
# Alias so `uvx secondbrain-py` launches the MCP server (uvx matches the console
# script to the normalized distribution name; matches server.json's uvx
# runtimeHint for the MCP registry; the human CLI remains `brain`).
secondbrain-py = "brain.mcp_server:main"
brain-up = "brain.bin.up:main"
brain-down = "brain.bin.down:main"
brain-status = "brain.bin.status:main"
brain-rebuild = "brain.bin.rebuild:main"
brain-install-launchd = "brain.bin.launchd:install_main"
brain-uninstall-launchd = "brain.bin.launchd:uninstall_main"
brain-monitor = "brain.bin.monitor:cli_main"

[project.urls]
Homepage = "https://github.com/mshtawythug/second-brain"
Repository = "https://github.com/mshtawythug/second-brain"
Issues = "https://github.com/mshtawythug/second-brain/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Include only the specific asset extensions used by the Quartz overlay tree.
# Explicit patterns rather than "**/*" so .pyc bytecode and __pycache__ dirs
# are never shipped into the wheel.
# Root-level files: quartz.config.ts, quartz.layout.ts  (*.ts covers them)
# Nested files under quartz/: TS/TSX components, JS/MJS CLI scripts, SCSS
# stylesheets, and PNG/ICO branding assets.
"brain.quartz_overrides" = [
    "*.ts",
    "**/*.ts",
    "**/*.tsx",
    "**/*.js",
    "**/*.mjs",
    "**/*.scss",
    "**/*.png",
    "**/*.ico",
]
# Templates shipped with the brain package for use by the installer.
# Explicit extension patterns (not "**/*") to avoid shipping bytecode.
# brain.templates root: docker-compose.yml.j2, Caddyfile.j2, env.example
# brain.templates.docker.age: pinned Dockerfile (PG16 + pgvector + AGE), a plain
#   data subdir (no __init__.py) materialized into $BRAIN_HOME by `brain setup`
# brain.templates.bin: shell launcher/helper scripts
# brain.templates.launchd: launchd plist Jinja2 templates
# brain.templates.skill: SKILL.md prose for Claude Code skill setup
"brain.templates" = ["*.j2", "env.example", "docker/age/Dockerfile"]
"brain.templates.bin" = ["*.sh"]
"brain.templates.launchd" = ["*.j2"]
"brain.templates.skill" = ["*.md"]
# Pre-landed by Task 0B (plan 2026-07-25) so no later wave has to edit this
# file: `packages.find` auto-discovers, so an entry whose package does not exist
# yet is simply inert until the wave that creates it lands.
#   brain.templates.claude: the session-end capture hook shell script that
#     `brain claude install-hooks` copies into the user's Claude Code config
#     directory (Task 1B, F1).
#   brain.ui: the static assets `brain ui` serves -- markup, styles, scripts,
#     and the branding images (the hand-authored aperture logo plus its
#     light/dark PNG renders, the app icon and the favicon). Explicit extension
#     patterns, never "**/*", mirroring the rule used above: the wildcard would
#     sweep __pycache__/*.pyc into the wheel. An image omitted here ships a
#     broken <img> with no error at all, so the set is guarded by
#     tests/test_ui_static_assets.py (Task 5A, F14; images added for A4).
"brain.templates.claude" = ["*.sh"]
"brain.ui" = [
    "static/*.html",
    "static/*.css",
    # setuptools resolves these with glob, where `*` STOPS AT `/` -- so
    # "static/*.css" does NOT match "static/css/tokens.css". The stylesheet was
    # split into static/css/ and without this second pattern the wheel would
    # ship index.html with four <link> tags and none of the files they point
    # at: a blank page, in a build where every local test still passes, because
    # the tests read the source tree and not the wheel.
    "static/css/*.css",
    "static/*.js",
    # Same trap, second instance: app.js was split into static/js/ (api, store,
    # tree, results, inspector, keys, main + dom), and "static/*.js" does NOT
    # match "static/js/main.js" because `*` stops at `/`. index.html loads
    # main.js as the module ENTRY POINT, so without this pattern the wheel
    # ships a page whose entire module graph 404s -- a blank page, in a build
    # where every local test still passes, because the tests read the source
    # tree and not the wheel. theme.js and tree_nav.js still live at the top
    # level, so "static/*.js" above stays load-bearing too.
    "static/js/*.js",
    "static/*.svg",
    "static/*.png",
    "static/*.ico",
]
# brain.demo: the synthetic `brain demo` corpus manifest (a plain data subdir
# under corpus/, no __init__.py) shipped so the zero-Ollama taste test works on
# pipx/wheel installs. Explicit "corpus/*.json" (not "**/*") avoids bytecode.
"brain.demo" = ["corpus/*.json"]
# brain/migrations: the numbered SQL schema migrations `brain init` applies in
# name order (discovered by db.migrations_dir()). They live INSIDE the package —
# migrations/ under src/brain/, NOT the repo root — so wheel / pip installs
# bundle them; without this `brain init` globs an empty dir and never creates the
# schema. Explicit "migrations/*.sql" (not "**/*") ships only the SQL.
"brain" = ["migrations/*.sql"]

[tool.setuptools.exclude-package-data]
# Strip bytecode caches that Python creates on-disk when the package is imported
# during a dev install — they are local artefacts and must not appear in wheels.
"brain.quartz_overrides" = ["__pycache__/*", "*.pyc"]
"brain.templates" = ["__pycache__/*", "*.pyc"]
"brain.templates.bin" = ["__pycache__/*", "*.pyc"]
"brain.templates.launchd" = ["__pycache__/*", "*.pyc"]
"brain.templates.skill" = ["__pycache__/*", "*.pyc"]
"brain.demo" = ["__pycache__/*", "*.pyc"]
# Twins of the two Task 0B package-data entries above; inert until Waves 1/5
# create those packages.
"brain.templates.claude" = ["__pycache__/*", "*.pyc"]
"brain.ui" = ["__pycache__/*", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=brain --cov-report=term-missing --cov-fail-under=85 -m 'not eval and not benchmark and not e2e and not phase3 and not live_db and not browser'"
markers = [
  # P3.5 — frontend integration harness. Tests under this marker shell
  # out to `npx quartz build` and serve the artifact over HTTP (or rsync the
  # live vault for the FastPath T0 perf benchmarks), so they require a Node
  # toolchain + the live brain Quartz workspace at `~/brain-vault/.quartz/`.
  # EXCLUDED from the default suite (see the ``addopts`` -m filter, alongside
  # ``eval`` / ``benchmark``): they are non-hermetic (need a live vault, and
  # the FastPath benchmarks rsync it — racing the live build daemon) and far
  # too slow for every local run. Opt IN with `-m e2e`; CI runs them in a
  # dedicated workflow.
  "e2e: end-to-end Quartz build + serve test (requires npx + live workspace)",
  # Phase D — search-ranking-fix. Tests under this marker connect to the
  # live local Postgres (`second_brain` database) and to a real Ollama
  # instance to embed a known-bad query and measure cosine similarity to
  # a known-bad doc. Used to tune ``DEFAULT_VECTOR_SIM_FLOOR`` and to
  # canary-check the post-fix corpus. Skipped on hosts without those
  # services; opt out via `-m "not live_db"`.
  # EXCLUDED from the default suite as of C7 (2026-08-07), for the same reason
  # ``eval`` is: a gating suite whose pass/fail depends on a live daemon, a live
  # corpus and free RAM is not a gate. On 2026-08-07 these three tests failed
  # inside a full run and passed 3/3 in isolation, in a 584-test search slice,
  # and with no unrestored env writes anywhere — they were reporting machine
  # conditions, and they looked exactly like a search-ranking regression. That
  # near-miss is the reason for this line.
  #
  # Do NOT re-enable them thinking it raises coverage: they assert ranking
  # against whatever happens to be in the operator's production corpus, so what
  # they add is variance, not coverage. Run them deliberately:
  #
  #     pytest -m live_db --no-cov   # canaries + similarity-floor checks
  #
  # `--no-cov` is not optional: addopts still carries --cov-fail-under=85,
  # which a 7-test run trips even when every test passes.
  #
  "live_db: requires live local Postgres + Ollama; opt-IN via -m live_db",
  # NOTE ``live_ollama`` is deliberately NOT in the deselect list, and is
  # registered in tests/conftest.py rather than here. It does double duty: on
  # the canaries it means "needs a real embedder", but on
  # tests/test_llm_hermeticity.py::test_live_ollama_marker_lifts_the_guard it
  # only lifts the socket ban — that test needs no live service, runs in 0.25 s,
  # and is the ONLY proof that the escape hatch still works. Excluding the
  # marker took it out of the gate, so a future break in `_forbid_live_ollama`'s
  # opt-out would have surfaced as a confusing corpus error under `-m live_db`
  # instead of a red test. `not live_db` alone already deselects both canary
  # modules, since they carry both markers.
  # Wave Q1-B — Eval harness. Tests under this marker run the 20-query
  # golden corpus against the live local Postgres + Ollama, scoring
  # nDCG@5 / MRR / Recall@20.  Excluded from the default suite; opt-IN
  # via `-m eval`.  Skips cleanly when Postgres or Ollama is unreachable.
  "eval: live golden-corpus run; gated, requires explicit -m eval invocation",
  # Wave G1-d / G2 — GraphRAG benchmark perf gate. Tests under this marker
  # load the full-scale synthetic graph (50k entities / 500k CO_OCCURS / 1M
  # mentions / 10 tenants — tests/graphrag/benchmark_fixture.py) and measure
  # P95 traversal/themes latency. EXCLUDED from the default suite (see
  # ``addopts`` -m filter) because the load is far too slow for every run;
  # G2's perf gate opts IN via ``pytest -m benchmark``. The default suite
  # exercises the SAME generator via the tiny ≈50-entity smoke instead.
  "benchmark: GraphRAG full-scale perf gate; requires explicit -m benchmark invocation",
  # brain-rebuild advisory-lock + real-DB tests. These need the test Postgres
  # container (port 5434) to be up but do NOT require Ollama. Included in the
  # default suite (not excluded by the addopts -m filter) because the test DB
  # is required for most other tests anyway; marked for easy targeted runs via
  # ``pytest -m integration``.
  "integration: requires the test Postgres container (port 5434, db second_brain_test)",
  # Plan 05 — `brain timeline` migration-021 roundtrip. The only test that
  # requires the optional generated ``documents.doc_date`` column (Phase 3).
  # EXCLUDED from the default suite (see the ``addopts`` -m filter, alongside
  # ``eval`` / ``benchmark``) so v1/v2 CI passes without migration 021 applied;
  # opt IN with `-m phase3`.
  "phase3: requires the optional migration-021 doc_date column (brain timeline Phase 3)",
  # Wave 6.1 — test-DB reset strategy opt-out. The per-test ``test_db`` fixture
  # normally does a cheap ``TRUNCATE`` reset on top of a schema migrated ONCE per
  # session (conftest ``_truncate_reset``). Tests that mutate the *schema* itself
  # (DROP/ALTER/CREATE on tables, indexes, extensions; ``ensure_embedding_column``
  # resizes; ``finalize_embedding_index`` NOT NULL/index; re-running migrations;
  # own-connection ``DROP SCHEMA``) must carry this marker: the fixture then falls
  # back to the full ``DROP SCHEMA`` + migrate reset for that test AND an autouse
  # teardown re-establishes the migrated-once baseline afterwards, so the next
  # (TRUNCATE-only) test is not poisoned by the leaked schema mutation. INCLUDED
  # in the default suite — it is a routing hint, not an exclusion filter.
  "fresh_schema: needs a full drop+migrate reset (mutates schema, not just data)",
  # Drives the real `brain ui` assets in a real browser. EXCLUDED from the
  # default suite: it needs the `browser` extra and a cached chromium, so
  # in the gate it would skip — and a skip reads exactly like a pass.
  # Run explicitly: `pytest tests/test_ui_browser.py -m browser --no-cov`.
  # The PATH is required, not decoration: marker deselection happens AFTER
  # collection, and `tests/test_restore_{gate,swap}.py` open a DB connection at
  # import time — so a bare `-m browser` dies with 2 collection errors against
  # an unreachable database. Naming the file is what makes "needs no Postgres"
  # true. Same applies to `-m nodb`.
  "browser: executes the UI in a real browser (needs the `browser` extra)",
  # Opens NO database connection. Read files, parse ASTs, shell out to node —
  # nothing more. INCLUDED in the default suite: this is a routing hint, not an
  # exclusion filter, and it is read by ``conftest._session_touches_the_database``.
  #
  # A session in which EVERY collected test carries this marker (or ``browser``)
  # skips both ``_exclusive_test_database`` and ``_ensure_test_db_initialized``,
  # so it needs no live Postgres and — the part that matters on this box — does
  # not take the machine-wide advisory lock. Four file-only suites were
  # serialising against every other agent's run for a schema they never read;
  # one such run blocked this worktree for over fifteen minutes.
  #
  # Adding a test that touches the database to a marked module is not silent:
  # the connection fails loudly. Removing the marker is the visible act that
  # says "this module now needs the DB".
  "nodb: opens no database connection (skips the DB fixtures and the suite lock)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer uses typer.Argument/Option/Typer as defaults — the standard idiom.
extend-immutable-calls = ["typer.Argument", "typer.Option", "typer.Typer"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
# `pygments.*` joins this list rather than pulling in `types-Pygments`: it ships
# no stubs, and the alternative is a new dev dependency to describe two call
# sites (`get_lexer_by_name`, `HtmlFormatter`) whose return values are used only
# as `str`. `_highlight_code` annotates its own signature, so the typed surface
# this project owns is unchanged.
module = ["pgvector.*", "pdfplumber.*", "pypdf.*", "markdown_it.*", "docx.*", "tiktoken.*", "reportlab.*", "voyageai.*", "watchdog.*", "networkx.*", "pygments.*"]
ignore_missing_imports = true

# numpy (transitive via networkx) ships PEP 695 `type X = ...` aliases in its
# bundled stubs, which are 3.12+ syntax. With our `python_version = "3.11"`
# target, mypy rejects that syntax in `numpy/__init__.pyi` and halts before it
# ever reaches brain code ("errors prevented further checking"). We never import
# numpy directly, so skip following into it entirely — keeps the 3.11 target for
# our own code while unblocking the gate. `follow_imports_for_stubs` makes the
# skip apply to the `.pyi` too (not just runtime modules).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
