[project]
name = "second-brain"
version = "0.1.0"
description = "Local personal knowledge base with hybrid search, queryable by Claude"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "pypdf>=5.0",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "markdown-it-py>=3.0",
  "typer>=0.13",
  "rich>=13.9",
  "python-dotenv>=1.0",
  "tiktoken>=0.8",
  "mcp>=1.0,<2.0",
  "voyageai>=0.3",
  "pyyaml>=6.0",
  "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "coverage<7.13", "pytest-mock>=3.14", "ruff>=0.7", "mypy>=1.13", "reportlab>=4.0", "types-PyYAML>=6.0"]

[project.scripts]
brain = "brain.cli:app"
brain-mcp = "brain.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Include all non-Python overlay assets (TypeScript, SCSS, JS, images, etc.)
# that live inside brain.quartz_overrides/. Without this declaration, a wheel
# or pipx install would silently drop every non-.py file and
# importlib.resources.files("brain.quartz_overrides") would return an empty tree.
# "**/*" captures both root-level files (quartz.config.ts, quartz.layout.ts)
# and all deeply nested files under quartz/ (confirmed via glob test: Python 3.11
# glob.glob("**/*", recursive=True) matches zero-component ** case at root).
"brain.quartz_overrides" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=brain --cov-report=term-missing --cov-fail-under=85 -m 'not eval'"
markers = [
  # P3.5 — frontend integration harness. Tests under this marker shell
  # out to `npx quartz build` and serve the artifact over HTTP, so they
  # require a Node toolchain + the live brain Quartz workspace at
  # `~/brain-vault/.quartz/`. Marked separately from the default suite
  # so CI runners without Node can opt out via `-m "not e2e"`.
  "e2e: end-to-end Quartz build + serve test (requires npx + live workspace)",
  # Phase D — search-ranking-fix. Tests under this marker connect to the
  # live local Postgres (`second_brain` database) and to a real Ollama
  # instance to embed a known-bad query and measure cosine similarity to
  # a known-bad doc. Used to tune ``DEFAULT_VECTOR_SIM_FLOOR`` and to
  # canary-check the post-fix corpus. Skipped on hosts without those
  # services; opt out via `-m "not live_db"`.
  "live_db: requires live local Postgres + Ollama (Phase D verification)",
  # Wave Q1-B — Eval harness. Tests under this marker run the 20-query
  # golden corpus against the live local Postgres + Ollama, scoring
  # nDCG@5 / MRR / Recall@20.  Excluded from the default suite; opt-IN
  # via `-m eval`.  Skips cleanly when Postgres or Ollama is unreachable.
  "eval: live golden-corpus run; gated, requires explicit -m eval invocation",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer uses typer.Argument/Option/Typer as defaults — the standard idiom.
extend-immutable-calls = ["typer.Argument", "typer.Option", "typer.Typer"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "pdfplumber.*", "pypdf.*", "markdown_it.*", "docx.*", "tiktoken.*", "reportlab.*", "voyageai.*", "watchdog.*"]
ignore_missing_imports = true
